<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Utang Tracker</title>
<style>
:root{--bg:#F3F4FA;--panel:#fff;--ink:#1D1B34;--muted:#6A6886;--accent:#6A4DF4}
@media (prefers-color-scheme:dark){:root{--bg:#111022;--panel:#1B1A31;--ink:#EEEDF8;--muted:#A3A1C0;--accent:#9A84FF}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",sans-serif;padding:16px;box-sizing:border-box}
.card{background:var(--panel);border-radius:20px;padding:26px;max-width:380px;text-align:center;box-shadow:0 12px 32px rgba(20,16,50,.12)}
h1{font-size:22px;margin:0 0 8px} p{margin:0 0 18px;color:var(--muted)}
button{border:0;border-radius:12px;background:var(--accent);color:#fff;font:700 16px system-ui,sans-serif;padding:12px 22px}
</style></head>
<body><div class="card">
<h1>You’re offline</h1>
<p>Utang Tracker needs the internet the first time you sign in. After that it keeps working offline and syncs when you’re back.</p>
<button onclick="location.href='https://maxaz1986.github.io/utang-tracker-web/app/'">Try again</button>
</div></body></html>
